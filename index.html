<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Vendas Motos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#273549; --border:#334155;
  --text:#e2e8f0; --muted:#94a3b8; --accent:#f59e0b; --accent2:#fbbf24;
  --green:#22c55e; --red:#ef4444; --blue:#3b82f6; --radius:14px;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; padding-bottom:80px}
header{position:sticky; top:0; z-index:50; background:linear-gradient(135deg,#0f172a,#1e293b); border-bottom:2px solid var(--accent); padding:14px 16px; display:flex; align-items:center; justify-content:space-between}
header h1{font-size:18px; color:var(--accent2)}
header .vend-sel{display:flex; align-items:center; gap:8px}
header select{max-width:140px}
main{padding:16px; max-width:760px; margin:0 auto}
nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:50; display:flex; background:#0b1220; border-top:1px solid var(--border)}
nav.tabs button{flex:1; background:none; border:none; color:var(--muted); padding:10px 4px 14px; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer}
nav.tabs button .ic{font-size:20px}
nav.tabs button.active{color:var(--accent2)}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px}
.card h2{font-size:15px; margin-bottom:12px; color:var(--accent2); display:flex; align-items:center; gap:6px}
.card h3{font-size:13px; margin:10px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px}
label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px}
input,select,textarea{width:100%; background:#0b1220; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:11px 12px; font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); border-color:transparent}
.row{display:flex; gap:10px}
.row>*{flex:1}
button.btn{width:100%; background:var(--accent); color:#0f172a; font-weight:700; border:none; border-radius:12px; padding:14px; font-size:16px; margin-top:14px; cursor:pointer}
button.btn:active{transform:scale(.98)}
button.btn.sec{background:var(--card2); color:var(--text); border:1px solid var(--border)}
button.btn.sm{width:auto; padding:8px 14px; font-size:13px; margin-top:0}
button.btn.danger{background:var(--red); color:#fff}
.mini{background:none; border:none; color:var(--red); font-size:18px; cursor:pointer; padding:4px 8px}
.pay-item{display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; background:var(--card2); padding:10px; border-radius:10px; flex-wrap:wrap}
.pay-item>div{flex:1; min-width:110px}
.pay-item label{margin-top:0}
.chip{display:inline-block; background:var(--card2); border:1px solid var(--border); border-radius:20px; padding:3px 10px; font-size:12px; margin:2px}
.chip.green{border-color:var(--green); color:var(--green)}
.chip.red{border-color:var(--red); color:var(--red)}
.chip.blue{border-color:var(--blue); color:#93c5fd}
.toggle-group{display:flex; gap:8px; margin-top:6px}
.toggle-group button{flex:1; background:var(--card2); border:1px solid var(--border); color:var(--muted); border-radius:10px; padding:10px; font-size:13px; cursor:pointer}
.toggle-group button.on{background:var(--accent); color:#0f172a; font-weight:700; border-color:var(--accent)}
.list-item{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--card2); border-radius:10px; margin-bottom:8px; gap:8px}
.list-item .info{flex:1; min-width:0}
.list-item .t1{font-size:14px; font-weight:600}
.list-item .t2{font-size:12px; color:var(--muted); margin-top:2px}
.badge{font-size:10px; padding:2px 8px; border-radius:10px; font-weight:700; text-transform:uppercase}
.badge.venda{background:#14532d; color:#86efac}
.badge.acessorio{background:#1e3a8a; color:#93c5fd}
.badge.seminovo{background:#78350f; color:#fcd34d}
.total-line{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px dashed var(--border)}
.total-line.big{font-size:16px; font-weight:700; color:var(--accent2); border-bottom:none; padding-top:8px}
table{width:100%; border-collapse:collapse; font-size:12px}
th,td{padding:6px 8px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted); font-size:10px; text-transform:uppercase}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}
.hidden{display:none!important}
.warn{color:var(--red); font-size:13px; margin-top:6px}
.ok{color:var(--green); font-size:13px; margin-top:6px}
.muted{color:var(--muted); font-size:12px}
.admin-row{display:flex; gap:8px; margin-bottom:8px; align-items:center}
.admin-row input{flex:1}
.admin-row input.narrow{max-width:90px; flex:none}
.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--green); color:#052e16; font-weight:700; padding:12px 24px; border-radius:30px; z-index:100; box-shadow:0 4px 20px rgba(0,0,0,.5); animation:fadein .2s}
.toast.err{background:var(--red); color:#fff}
@keyframes fadein{from{opacity:0; transform:translate(-50%,10px)}to{opacity:1; transform:translate(-50%,0)}}
.doc-perda{background:#7f1d1d33; border:1px solid var(--red); border-radius:10px; padding:12px; margin-top:10px}
.month-nav{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.month-nav button{background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:8px 14px; font-size:16px; cursor:pointer}
.month-nav .m{flex:1; text-align:center; font-weight:700; font-size:16px; color:var(--accent2); text-transform:capitalize}
</style>
</head>
<body>

<header>
  <h1>🏍️ Vendas</h1>
  <div class="vend-sel">
    <select id="selVendedorAtivo" onchange="setVendedorAtivo(this.value)"></select>
  </div>
</header>

<main>
  <!-- ============ ABA LANÇAR ============ -->
  <section id="tab-lancar">
    <div class="card">
      <h2>Novo Lançamento</h2>
      <label>Tipo de lançamento</label>
      <div class="toggle-group" id="tipoLanc">
        <button data-t="venda" class="on" onclick="setTipoLanc('venda')">🏍️ Venda de Moto</button>
        <button data-t="acessorio" onclick="setTipoLanc('acessorio')">🧰 Acessório Avulso</button>
        <button data-t="seminovo" onclick="setTipoLanc('seminovo')">♻️ Captação Seminovo</button>
      </div>

      <label>Data</label>
      <input type="date" id="fData">

      <!-- ===== VENDA DE MOTO ===== -->
      <div id="formVenda">
        <label>Moto vendida</label>
        <select id="fMoto"></select>
        <label>Valor total da moto (R$)</label>
        <input type="number" id="fValorMoto" step="0.01" inputmode="decimal" placeholder="0,00" oninput="pagStatus()">

        <h3>Pagamentos</h3>
        <div id="listaPagamentos"></div>
        <button class="btn sec sm" onclick="addPagamento()">＋ Adicionar pagamento</button>
        <div id="pagStatus"></div>

        <h3>Acessórios na venda</h3>
        <label>Valor de acessórios (R$) — opcional</label>
        <input type="number" id="fAcessVenda" step="0.01" inputmode="decimal" placeholder="0,00">

        <h3>Documentação</h3>
        <div class="toggle-group" id="docStatus">
          <button data-d="feita" class="on" onclick="setDocStatus('feita')">✅ Com documentação</button>
          <button data-d="perda" onclick="setDocStatus('perda')">🚫 Sem documentação</button>
        </div>
        <div id="docFeita">
          <div class="row">
            <div><label>Valor (R$)</label><input type="number" id="fDocValor" step="0.01" inputmode="decimal"></div>
            <div><label>Desconto (R$)</label><input type="number" id="fDocDesc" step="0.01" inputmode="decimal" value="0"></div>
          </div>
          <label>Tabela</label>
          <select id="fDocTabela"></select>
        </div>
        <div id="docPerda" class="doc-perda hidden">
          <label style="color:#fca5a5">💬 Motivo da perda da documentação (obrigatório)</label>
          <textarea id="fDocMotivo" rows="2" placeholder="Ex.: cliente fez no despachante próprio, preço, etc."></textarea>
        </div>
      </div>

      <!-- ===== ACESSÓRIO AVULSO ===== -->
      <div id="formAcess" class="hidden">
        <label>Descrição do acessório</label>
        <input type="text" id="fAcessDesc" placeholder="Ex.: capacete, baú, película...">
        <label>Valor (R$)</label>
        <input type="number" id="fAcessValor" step="0.01" inputmode="decimal" placeholder="0,00">
      </div>

      <!-- ===== SEMINOVO ===== -->
      <div id="formSeminovo" class="hidden">
        <label>Moto captada (descrição)</label>
        <input type="text" id="fSnMoto" placeholder="Ex.: CG 160 2021 vermelha">
        <p class="muted" style="margin-top:8px">Prêmio fixo por captação: <b id="snPremioInfo"></b></p>
      </div>

      <button class="btn" id="btnSalvar" onclick="salvarLancamento()">💾 Salvar Lançamento</button>
      <button class="btn sec hidden" id="btnCancelEdit" onclick="cancelarEdicao()">Cancelar edição</button>
    </div>
  </section>

  <!-- ============ ABA LANÇAMENTOS ============ -->
  <section id="tab-lista" class="hidden">
    <div class="month-nav">
      <button onclick="mudarMes(-1,'lista')">‹</button>
      <div class="m" id="mesLista"></div>
      <button onclick="mudarMes(1,'lista')">›</button>
    </div>
    <div class="card">
      <h2>Lançamentos do mês</h2>
      <label>Filtrar vendedor</label>
      <select id="filtroVend" onchange="renderLista()"></select>
      <div id="listaLanc" style="margin-top:12px"></div>
    </div>
  </section>

  <!-- ============ ABA APURAÇÃO ============ -->
  <section id="tab-apuracao" class="hidden">
    <div class="month-nav">
      <button onclick="mudarMes(-1,'apu')">‹</button>
      <div class="m" id="mesApu"></div>
      <button onclick="mudarMes(1,'apu')">›</button>
    </div>
    <div class="card">
      <h2>Parâmetros DSR do mês</h2>
      <div class="row">
        <div><label>Domingos + feriados</label><input type="number" id="dsrDomFer" onchange="salvarDsrMes()"></div>
        <div><label>Dias úteis</label><input type="number" id="dsrUteis" onchange="salvarDsrMes()"></div>
      </div>
      <p class="muted" style="margin-top:6px">DSR = comissão × (domingos+feriados ÷ dias úteis)</p>
    </div>
    <div id="apuResultado"></div>
    <div class="card">
      <h2>Exportar / Backup</h2>
      <button class="btn" onclick="exportarExcel()">📊 Exportar Excel (apuração)</button>
      <button class="btn sec" onclick="exportarJSON()">⬇️ Exportar dados (backup/consolidação)</button>
      <button class="btn sec" onclick="document.getElementById('impFile').click()">⬆️ Importar dados de outro aparelho</button>
      <input type="file" id="impFile" accept=".json" class="hidden" onchange="importarJSON(this)">
    </div>
  </section>

  <!-- ============ ABA ADMIN ============ -->
  <section id="tab-admin" class="hidden">
    <div class="card" id="adminLock">
      <h2>🔒 Administração</h2>
      <label>PIN de acesso</label>
      <input type="password" id="pinInput" inputmode="numeric" placeholder="PIN">
      <button class="btn" onclick="destravarAdmin()">Entrar</button>
      <p class="muted" style="margin-top:8px">PIN padrão: 1234 (altere depois de entrar)</p>
    </div>
    <div id="adminArea" class="hidden"></div>
  </section>
</main>

<nav class="tabs">
  <button class="active" data-tab="lancar" onclick="showTab('lancar')"><span class="ic">➕</span>Lançar</button>
  <button data-tab="lista" onclick="showTab('lista')"><span class="ic">📋</span>Lançamentos</button>
  <button data-tab="apuracao" onclick="showTab('apuracao')"><span class="ic">📊</span>Apuração</button>
  <button data-tab="admin" onclick="showTab('admin')"><span class="ic">⚙️</span>Admin</button>
</nav>

<script>
/* ================= ESTADO ================= */
const DBKEY='motovendas_v1';
const DEFAULT_DB={
  config:{
    pin:'1234',
    pctMoto:1,
    pctAcess:5,
    premioSeminovo:100,
    docTabelas:[
      {id:'t1', nome:'Tabela 1', pct:0},
      {id:'t2', nome:'Tabela 2', pct:0},
      {id:'t3', nome:'Tabela 3', pct:0}
    ],
    bancos:[{id:'b1',nome:'Banco 1',pct:1},{id:'b2',nome:'Banco 2',pct:1}],
    motos:['CG 160 Start','CG 160 Fan','CG 160 Titan','Biz 125','Pop 110i','NXR 160 Bros','XRE 190','PCX 160','CB 300F Twister'],
    vendedores:['GABRIEL','PATRICIA','WENDRYL','IGOR','LUAN'],
    faixasQt:[{min:10,premio:300},{min:15,premio:600}],
    faixasEmpl:[{min:5,premio:50},{min:8,premio:80},{min:10,premio:90}],
    dsrMeses:{}
  },
  lancamentos:[]
};
let DB=carregar();
let pagamentos=[];
let tipoLanc='venda';
let docStatusSel='feita';
let mesAtual=new Date().toISOString().slice(0,7);
let editId=null;
let adminAberto=false;

function carregar(){
  try{
    const raw=localStorage.getItem(DBKEY);
    if(!raw) return structuredClone(DEFAULT_DB);
    const db=JSON.parse(raw);
    db.config={...structuredClone(DEFAULT_DB.config),...db.config};
    return db;
  }catch(e){ return structuredClone(DEFAULT_DB); }
}
function salvar(){ localStorage.setItem(DBKEY, JSON.stringify(DB)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function num(id){ return parseFloat(document.getElementById(id).value)||0; }
function toast(msg,err){
  const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2500);
}
function nomeMes(ym){
  const [y,m]=ym.split('-');
  return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
}

/* ================= NAVEGAÇÃO ================= */
function showTab(t){
  ['lancar','lista','apuracao','admin'].forEach(x=>{
    document.getElementById('tab-'+x).classList.toggle('hidden',x!==t);
  });
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  if(t==='lista') renderLista();
  if(t==='apuracao') renderApuracao();
  if(t==='admin'&&adminAberto) renderAdmin();
}
function mudarMes(d,ctx){
  const [y,m]=mesAtual.split('-').map(Number);
  const nd=new Date(y,m-1+d,15);
  mesAtual=nd.toISOString().slice(0,7);
  if(ctx==='lista') renderLista(); else renderApuracao();
}

/* ================= VENDEDOR ATIVO ================= */
function setVendedorAtivo(v){ localStorage.setItem('vendAtivo',v); }
function getVendedorAtivo(){
  const at=localStorage.getItem('vendAtivo');
  return DB.config.vendedores.includes(at)?at:(DB.config.vendedores[0]||'');
}
function renderVendedores(){
  const at=getVendedorAtivo();
  document.getElementById('selVendedorAtivo').innerHTML=DB.config.vendedores.map(v=>`<option ${v===at?'selected':''}>${v}</option>`).join('');
  document.getElementById('filtroVend').innerHTML='<option value="">Todos</option>'+DB.config.vendedores.map(v=>`<option>${v}</option>`).join('');
}

/* ================= FORM LANÇAMENTO ================= */
function setTipoLanc(t){
  tipoLanc=t;
  document.querySelectorAll('#tipoLanc button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.getElementById('formVenda').classList.toggle('hidden',t!=='venda');
  document.getElementById('formAcess').classList.toggle('hidden',t!=='acessorio');
  document.getElementById('formSeminovo').classList.toggle('hidden',t!=='seminovo');
}
function setDocStatus(d){
  docStatusSel=d;
  document.querySelectorAll('#docStatus button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  document.getElementById('docFeita').classList.toggle('hidden',d!=='feita');
  document.getElementById('docPerda').classList.toggle('hidden',d!=='perda');
}
function renderSelects(){
  document.getElementById('fMoto').innerHTML=DB.config.motos.map(m=>`<option>${m}</option>`).join('');
  document.getElementById('fDocTabela').innerHTML=DB.config.docTabelas.map(t=>`<option value="${t.id}">${t.nome}</option>`).join('');
  document.getElementById('snPremioInfo').textContent=fmt(DB.config.premioSeminovo);
}
function addPagamento(){
  pagamentos.push({tipo:'À Vista', banco:'', valor:0});
  renderPagamentos();
}
function rmPagamento(i){ pagamentos.splice(i,1); renderPagamentos(); }
function updPag(i,campo,val){
  pagamentos[i][campo]= campo==='valor'?(parseFloat(val)||0):val;
  if(campo==='tipo'&&val!=='Financiamento') pagamentos[i].banco='';
  if(campo==='tipo') renderPagamentos(); else pagStatus();
}
function renderPagamentos(){
  const el=document.getElementById('listaPagamentos');
  el.innerHTML=pagamentos.map((p,i)=>`
    <div class="pay-item">
      <div>
        <label>Forma</label>
        <select onchange="updPag(${i},'tipo',this.value)">
          ${['À Vista','Cartão','Financiamento','Consórcio'].map(t=>`<option ${p.tipo===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      ${p.tipo==='Financiamento'?`
      <div>
        <label>Banco</label>
        <select onchange="updPag(${i},'banco',this.value)">
          <option value="">Selecione...</option>
          ${DB.config.bancos.map(b=>`<option value="${b.id}" ${p.banco===b.id?'selected':''}>${b.nome}</option>`).join('')}
        </select>
      </div>`:''}
      <div>
        <label>Valor (R$)</label>
        <input type="number" step="0.01" inputmode="decimal" value="${p.valor||''}" onchange="updPag(${i},'valor',this.value)">
      </div>
      <button class="mini" onclick="rmPagamento(${i})">🗑️</button>
    </div>`).join('');
  pagStatus();
}
function pagStatus(){
  const el=document.getElementById('pagStatus');
  const tot=pagamentos.reduce((s,p)=>s+p.valor,0);
  const vm=num('fValorMoto');
  if(!pagamentos.length){ el.innerHTML='<p class="muted">Nenhum pagamento adicionado.</p>'; return; }
  const dif=vm-tot;
  el.innerHTML= Math.abs(dif)<0.01
    ? `<p class="ok">✅ Pagamentos somam ${fmt(tot)} — confere com o valor da moto.</p>`
    : `<p class="warn">⚠️ Pagamentos somam ${fmt(tot)} — ${dif>0?'faltam':'excedem'} ${fmt(Math.abs(dif))}.</p>`;
}
function salvarLancamento(){
  const vend=getVendedorAtivo();
  if(!vend) return toast('Cadastre vendedores no Admin', true);
  const data=document.getElementById('fData').value||new Date().toISOString().slice(0,10);
  let l={id:editId||uid(), tipo:tipoLanc, vendedor:vend, data, mes:data.slice(0,7)};

  if(tipoLanc==='venda'){
    const vm=num('fValorMoto');
    if(vm<=0) return toast('Informe o valor da moto', true);
    if(!pagamentos.length) return toast('Adicione ao menos um pagamento', true);
    const tot=pagamentos.reduce((s,p)=>s+p.valor,0);
    if(Math.abs(tot-vm)>=0.01) return toast('Pagamentos não conferem com o valor da moto', true);
    if(pagamentos.some(p=>p.tipo==='Financiamento'&&!p.banco)) return toast('Selecione o banco do financiamento', true);
    l.moto=document.getElementById('fMoto').value;
    l.valorMoto=vm;
    l.pagamentos=structuredClone(pagamentos);
    l.valorAcess=num('fAcessVenda');
    if(docStatusSel==='feita'){
      l.doc={status:'feita', valor:num('fDocValor'), desconto:num('fDocDesc'), tabelaId:document.getElementById('fDocTabela').value};
    }else{
      const motivo=document.getElementById('fDocMotivo').value.trim();
      if(!motivo) return toast('Informe o motivo da perda da documentação', true);
      l.doc={status:'perda', motivo};
    }
  }else if(tipoLanc==='acessorio'){
    const v=num('fAcessValor');
    if(v<=0) return toast('Informe o valor do acessório', true);
    l.descricao=document.getElementById('fAcessDesc').value.trim();
    l.valor=v;
  }else{
    const d=document.getElementById('fSnMoto').value.trim();
    if(!d) return toast('Descreva a moto captada', true);
    l.descricao=d;
  }

  if(editId){ DB.lancamentos=DB.lancamentos.map(x=>x.id===editId?l:x); }
  else DB.lancamentos.push(l);
  salvar();
  toast(editId?'Lançamento atualizado!':'Lançamento salvo!');
  limparForm();
}
function limparForm(){
  editId=null;
  pagamentos=[];
  document.getElementById('btnCancelEdit').classList.add('hidden');
  document.getElementById('btnSalvar').textContent='💾 Salvar Lançamento';
  ['fValorMoto','fAcessVenda','fDocValor','fDocMotivo','fAcessDesc','fAcessValor','fSnMoto'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fDocDesc').value='0';
  document.getElementById('fData').value=new Date().toISOString().slice(0,10);
  setDocStatus('feita');
  addPagamento();
}
function cancelarEdicao(){ limparForm(); toast('Edição cancelada'); }
function editarLanc(id){
  const l=DB.lancamentos.find(x=>x.id===id);
  if(!l) return;
  editId=id;
  showTab('lancar');
  setTipoLanc(l.tipo);
  document.getElementById('fData').value=l.data;
  if(l.tipo==='venda'){
    document.getElementById('fMoto').value=l.moto;
    document.getElementById('fValorMoto').value=l.valorMoto;
    document.getElementById('fAcessVenda').value=l.valorAcess||'';
    pagamentos=structuredClone(l.pagamentos);
    renderPagamentos();
    if(l.doc.status==='feita'){
      setDocStatus('feita');
      document.getElementById('fDocValor').value=l.doc.valor;
      document.getElementById('fDocDesc').value=l.doc.desconto;
      document.getElementById('fDocTabela').value=l.doc.tabelaId;
    }else{
      setDocStatus('perda');
      document.getElementById('fDocMotivo').value=l.doc.motivo;
    }
  }else if(l.tipo==='acessorio'){
    document.getElementById('fAcessDesc').value=l.descricao||'';
    document.getElementById('fAcessValor').value=l.valor;
  }else{
    document.getElementById('fSnMoto').value=l.descricao;
  }

  document.getElementById('btnCancelEdit').classList.remove('hidden');
}
function excluirLanc(id){
  if(!confirm('Excluir este lançamento?')) return;

  salvar(); renderLista(); toast('Excluído');
}

/* ================= LISTA ================= */

    let t1='',t2='';

      t1=`${l.moto} — ${fmt(l.valorMoto)}`;

      const doc=l.doc.status==='feita'?`Doc ${nomeTabela(l.doc.tabelaId)} ${fmt(l.doc.valor-l.doc.desconto)}`:`🚫 Doc perdida: ${l.doc.motivo}`;
      t2=`${l.vendedor} · ${l.data.slice(8,10)}/${l.data.slice(5,7)} · ${pg}${l.valorAcess?` · Acess ${fmt(l.valorAcess)}`:''} · ${doc}`;
    }else if(l.tipo==='acessorio'){

      t2=`${l.vendedor} · ${l.data.slice(8,10)}/${l.data.slice(5,7)}`;
    }else{
      t1=l.descricao;
      t2=`${l.vendedor} · ${l.data.slice(8,10)}/${l.data.slice(5,7)} · Prêmio ${fmt(DB.config.premioSeminovo)}`;

      <button class="mini" onclick="excluirLanc('${l.id}')">🗑️</button>

function nomeBanco(id){ const b=DB.config.bancos.find(x=>x.id===id); return b?b.nome:'?'; }
function nomeTabela(id){ const t=DB.config.docTabelas.find(x=>x.id===id); return t?t.nome:'?'; }

/* ================= APURAÇÃO ================= */
function getDsrMes(){
  return DB.config.dsrMeses[mesAtual]||{domFer:5,uteis:25};
}
function salvarDsrMes(){
  DB.config.dsrMeses[mesAtual]={domFer:num('dsrDomFer'),uteis:num('dsrUteis')};
  salvar(); renderApuracao();
}
function premioFaixa(faixas,qtd){
  let p=0;
  faixas.slice().sort((a,b)=>a.min-b.min).forEach(f=>{ if(qtd>=f.min) p=f.premio; });
  return p;
}
function calcularApuracao(mes){
  const c=DB.config;
  const dsr=c.dsrMeses[mes]||{domFer:5,uteis:25};
  const fator=dsr.uteis>0?dsr.domFer/dsr.uteis:0;
  const res={};
  c.vendedores.forEach(v=>{
    res[v]={valorMotos:0,qtVendas:0,comMotos:0,dsrMotos:0,comFin:0,dsrFin:0,valorAcess:0,comAcess:0,dsrAcess:0,
            comDoc:0,qtEmpl:0,qtSN:0,premioQt:0,premioEmpl:0,premioSN:0,docsPerdidas:[],pagFormas:{},total:0};
  });
  DB.lancamentos.filter(l=>l.mes===mes).forEach(l=>{
    const r=res[l.vendedor]; if(!r) return;
    if(l.tipo==='venda'){
      r.valorMotos+=l.valorMoto; r.qtVendas++;
      r.valorAcess+=l.valorAcess||0;
      l.pagamentos.forEach(p=>{
        const key=p.tipo==='Financiamento'?`Financiamento (${nomeBanco(p.banco)})`:p.tipo;
        r.pagFormas[key]=(r.pagFormas[key]||0)+p.valor;
        if(p.tipo==='Financiamento'){
          const b=c.bancos.find(x=>x.id===p.banco);
          if(b) r.comFin+=p.valor*b.pct/100;
        }
      });
      if(l.doc.status==='feita'){
        r.qtEmpl++;
        const t=c.docTabelas.find(x=>x.id===l.doc.tabelaId);
        if(t) r.comDoc+=(l.doc.valor-l.doc.desconto)*t.pct/100;
      }else{
        r.docsPerdidas.push({moto:l.moto,motivo:l.doc.motivo,data:l.data});
      }
    }else if(l.tipo==='acessorio'){
      r.valorAcess+=l.valor;
    }else{
      r.qtSN++;
    }
  });
  Object.values(res).forEach(r=>{
    r.comMotos=r.valorMotos*c.pctMoto/100;
    r.dsrMotos=r.comMotos*fator;
    r.dsrFin=r.comFin*fator;
    r.comAcess=r.valorAcess*c.pctAcess/100;
    r.dsrAcess=r.comAcess*fator;
    r.premioQt=premioFaixa(c.faixasQt,r.qtVendas);
    r.premioEmpl=premioFaixa(c.faixasEmpl,r.qtEmpl);
    r.premioSN=r.qtSN*c.premioSeminovo;
    r.total=r.comMotos+r.dsrMotos+r.comFin+r.dsrFin+r.comAcess+r.dsrAcess+r.comDoc+r.premioQt+r.premioEmpl+r.premioSN;
  });
  return res;
}
function renderApuracao(){
  document.getElementById('mesApu').textContent=nomeMes(mesAtual);
  const dsr=getDsrMes();
  document.getElementById('dsrDomFer').value=dsr.domFer;
  document.getElementById('dsrUteis').value=dsr.uteis;
  const res=calcularApuracao(mesAtual);
  const el=document.getElementById('apuResultado');
  let html='';
  let geral=0;
  DB.config.vendedores.forEach(v=>{
    const r=res[v];
    geral+=r.total;
    if(r.qtVendas===0&&r.valorAcess===0&&r.qtSN===0) return;
    html+=`<div class="card">
      <h2>👤 ${v}</h2>
      <div class="total-line"><span>Vendas de motos (${r.qtVendas})</span><b>${fmt(r.valorMotos)}</b></div>
      <div class="total-line"><span>Comissão motos (${DB.config.pctMoto}%)</span><span>${fmt(r.comMotos)}</span></div>
      <div class="total-line"><span>DSR motos</span><span>${fmt(r.dsrMotos)}</span></div>
      <div class="total-line"><span>Comissão financiamentos</span><span>${fmt(r.comFin)}</span></div>
      <div class="total-line"><span>DSR financiamentos</span><span>${fmt(r.dsrFin)}</span></div>
      <div class="total-line"><span>Acessórios vendidos</span><span>${fmt(r.valorAcess)}</span></div>
      <div class="total-line"><span>Comissão acessórios (${DB.config.pctAcess}%)</span><span>${fmt(r.comAcess)}</span></div>
      <div class="total-line"><span>DSR acessórios</span><span>${fmt(r.dsrAcess)}</span></div>
      <div class="total-line"><span>Comissão documentação (${r.qtEmpl} docs)</span><span>${fmt(r.comDoc)}</span></div>
      <div class="total-line"><span>Prêmio qt. vendas</span><span>${fmt(r.premioQt)}</span></div>
      <div class="total-line"><span>Prêmio emplacamento</span><span>${fmt(r.premioEmpl)}</span></div>
      <div class="total-line"><span>Prêmio seminovos (${r.qtSN})</span><span>${fmt(r.premioSN)}</span></div>
      <div class="total-line big"><span>TOTAL</span><span>${fmt(r.total)}</span></div>
      ${Object.keys(r.pagFormas).length?`<h3>Formas de pagamento</h3>`+Object.entries(r.pagFormas).map(([k,v2])=>`<span class="chip blue">${k}: ${fmt(v2)}</span>`).join(''):''}
      ${r.docsPerdidas.length?`<h3 style="color:#fca5a5">Documentações perdidas (${r.docsPerdidas.length})</h3>`+r.docsPerdidas.map(d=>`<span class="chip red">${d.moto}: ${d.motivo}</span>`).join(''):''}
    </div>`;
  });
  html=`<div class="card"><h2>💰 Total geral do mês: ${fmt(geral)}</h2></div>`+(html||'<div class="card"><p class="muted">Sem lançamentos neste mês.</p></div>');
  el.innerHTML=html;
}

/* ================= EXPORT ================= */
function exportarExcel(){
  const res=calcularApuracao(mesAtual);
  const rows=[['Vendedor','Valor de Venda Motos','Comissão Motos','DSR Motos','Comissão Financiamentos','DSR Financiamentos','Comissão Acess.','DSR Acess.','Comissão Doc.','Prêmio Qt Vendas','Prêmio Emplacamento','Prêmio Moto SN','TOTAL']];
  DB.config.vendedores.forEach(v=>{
    const r=res[v];
    rows.push([v,r.valorMotos,r.comMotos,r.dsrMotos,r.comFin,r.dsrFin,r.comAcess,r.dsrAcess,r.comDoc,r.premioQt,r.premioEmpl,r.premioSN,r.total]);
  });
  rows.push([]);
  rows.push(['DOCUMENTAÇÕES PERDIDAS']);
  rows.push(['Vendedor','Data','Moto','Motivo']);
  DB.config.vendedores.forEach(v=>{
    res[v].docsPerdidas.forEach(d=>rows.push([v,d.data,d.moto,d.motivo]));
  });
  rows.push([]);
  rows.push(['LANÇAMENTOS DO MÊS']);
  rows.push(['Data','Vendedor','Tipo','Descrição','Valor','Pagamentos','Documentação']);
  DB.lancamentos.filter(l=>l.mes===mesAtual).sort((a,b)=>a.data.localeCompare(b.data)).forEach(l=>{
    if(l.tipo==='venda'){
      rows.push([l.data,l.vendedor,'Venda Moto',l.moto,l.valorMoto,
        l.pagamentos.map(p=>`${p.tipo==='Financiamento'?'Financ. '+nomeBanco(p.banco):p.tipo}: ${p.valor}`).join(' | '),
        l.doc.status==='feita'?`${nomeTabela(l.doc.tabelaId)} R$${(l.doc.valor-l.doc.desconto).toFixed(2)}`:`PERDIDA: ${l.doc.motivo}`]);
    }else if(l.tipo==='acessorio'){
      rows.push([l.data,l.vendedor,'Acessório',l.descricao||'',l.valor,'','']);
    }else{
      rows.push([l.data,l.vendedor,'Captação SN',l.descricao,DB.config.premioSeminovo,'','']);
    }
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=rows[0].map(()=>({wch:18}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Apuração');
  XLSX.writeFile(wb,`Apuracao_${mesAtual}.xlsx`);
}
function exportarJSON(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`vendas_${getVendedorAtivo()}_${mesAtual}.json`;
  a.click();
}
function importarJSON(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const imp=JSON.parse(rd.result);
      if(!imp.lancamentos) throw 0;
      const ids=new Set(DB.lancamentos.map(l=>l.id));
      let n=0;
      imp.lancamentos.forEach(l=>{ if(!ids.has(l.id)){ DB.lancamentos.push(l); n++; } });
      salvar(); renderApuracao();
      toast(`${n} lançamento(s) importado(s)`);
    }catch(e){ toast('Arquivo inválido', true); }
  };
  rd.readAsText(f);
  input.value='';
}

    <h3>Prêmio Emplacamento</h3><p class="muted">A partir de X documentações → R$ Y</p><div id="admFaixasEmpl"></div>
    <div class="admin-row"><input id="feMin" class="narrow" type="number" placeholder="Qt mín."><input id="fePremio" type="number" placeholder="Prêmio R$"><button class="btn sm" onclick="admAddFaixa('faixasEmpl','feMin','fePremio')">＋</button></div></div>
  <div class="card"><h2>🔑 Segurança</h2>
    <label>Alterar PIN do admin</label><input type="text" id="novoPin" placeholder="Novo PIN">
    <button class="btn sec" onclick="admSetPin()">Salvar PIN</button></div>
  <div class="card"><h2>🗑️ Zona de perigo</h2>
    <button class="btn danger" onclick="admLimparMes()">Apagar lançamentos de ${nomeMes(mesAtual)}</button></div>`;

function admRenderListas(){
  const c=DB.config;
  document.getElementById('admVend').innerHTML=c.vendedores.map((v,i)=>`<div class="admin-row"><input value="${v}" onchange="admEditStr('vendedores',${i},this.value)"><button class="mini" onclick="admRm('vendedores',${i})">🗑️</button></div>`).join('');
  document.getElementById('admMotos').innerHTML=c.motos.map((m,i)=>`<div class="admin-row"><input value="${m}" onchange="admEditStr('motos',${i},this.value)"><button class="mini" onclick="admRm('motos',${i})">🗑️</button></div>`).join('');
  document.getElementById('admBancos').innerHTML=c.bancos.map((b,i)=>`<div class="admin-row"><input value="${b.nome}" onchange="admEditBanco(${i},'nome',this.value)"><input class="narrow" type="number" step="0.01" value="${b.pct}" onchange="admEditBanco(${i},'pct',this.value)"><span class="muted">%</span><button class="mini" onclick="admRm('bancos',${i})">🗑️</button></div>`).join('');
  document.getElementById('admDocs').innerHTML=c.docTabelas.map((t,i)=>`<div class="admin-row"><input value="${t.nome}" onchange="admEditDoc(${i},'nome',this.value)"><input class="narrow" type="number" step="0.01" value="${t.pct}" onchange="admEditDoc(${i},'pct',this.value)"><span class="muted">%</span></div>`).join('');
  document.getElementById('admFaixasQt').innerHTML=c.faixasQt.map((f,i)=>`<div class="admin-row"><span class="muted">≥</span><input class="narrow" type="number" value="${f.min}" onchange="admEditFaixa('faixasQt',${i},'min',this.value)"><span class="muted">vendas →</span><input type="number" value="${f.premio}" onchange="admEditFaixa('faixasQt',${i},'premio',this.value)"><button class="mini" onclick="admRm('faixasQt',${i})">🗑️</button></div>`).join('');
  document.getElementById('admFaixasEmpl').innerHTML=c.faixasEmpl.map((f,i)=>`<div class="admin-row"><span class="muted">≥</span><input class="narrow" type="number" value="${f.min}" onchange="admEditFaixa('faixasEmpl',${i},'min',this.value)"><span class="muted">docs →</span><input type="number" value="${f.premio}" onchange="admEditFaixa('faixasEmpl',${i},'premio',this.value)"><button class="mini" onclick="admRm('faixasEmpl',${i})">🗑️</button></div>`).join('');

function admAdd(lista,inputId){
  const v=document.getElementById(inputId).value.trim();
  if(!v) return;
  DB.config[lista].push(lista==='vendedores'?v.toUpperCase():v);
  document.getElementById(inputId).value='';
  salvar(); admRenderListas(); renderVendedores(); renderSelects();
}
function admAddBanco(){
  const n=document.getElementById('novoBanco').value.trim();
  const p=parseFloat(document.getElementById('novoBancoPct').value)||0;
  if(!n) return;
  DB.config.bancos.push({id:uid(),nome:n,pct:p});
  document.getElementById('novoBanco').value=''; document.getElementById('novoBancoPct').value='';
  salvar(); admRenderListas();
}
function admAddFaixa(lista,idMin,idPremio){
  const min=parseFloat(document.getElementById(idMin).value)||0;
  const premio=parseFloat(document.getElementById(idPremio).value)||0;
  if(min<=0) return;
  DB.config[lista].push({min,premio});
  document.getElementById(idMin).value=''; document.getElementById(idPremio).value='';
  salvar(); admRenderListas();
}
function admRm(lista,i){ DB.config[lista].splice(i,1); salvar(); admRenderListas(); renderVendedores(); renderSelects(); }
function admEditStr(lista,i,v){ DB.config[lista][i]=lista==='vendedores'?v.toUpperCase():v; salvar(); renderVendedores(); renderSelects(); }
function admEditBanco(i,campo,v){ DB.config.bancos[i][campo]=campo==='pct'?(parseFloat(v)||0):v; salvar(); }
function admEditDoc(i,campo,v){ DB.config.docTabelas[i][campo]=campo==='pct'?(parseFloat(v)||0):v; salvar(); renderSelects(); }
function admEditFaixa(lista,i,campo,v){ DB.config[lista][i][campo]=parseFloat(v)||0; salvar(); }
function admSet(campo,v){ DB.config[campo]=parseFloat(v)||0; salvar(); renderSelects(); }
function admSetPin(){
  const p=document.getElementById('novoPin').value.trim();
  if(p.length<4) return toast('PIN precisa de ao menos 4 dígitos', true);
  DB.config.pin=p; salvar(); toast('PIN alterado!');
}
function admLimparMes(){
  if(!confirm(`Apagar TODOS os lançamentos de ${nomeMes(mesAtual)}? Esta ação não pode ser desfeita.`)) return;
  DB.lancamentos=DB.lancamentos.filter(l=>l.mes!==mesAtual);
  salvar(); toast('Lançamentos apagados');
}

  addPagamento();

}
init();
